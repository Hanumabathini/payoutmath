# Every Monday, checks each platform's fee page and opens an issue if a fee
# the site depends on seems to have changed. Free on GitHub.
name: Fee check
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fee pages
        id: check
        run: |
          set +e
          python3 scripts/check_fees.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open an issue if something changed
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Fee check: a marketplace fee may have changed ($(date +%F))" \
            --body-file report.md
